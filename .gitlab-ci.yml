workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - build
  - package
  - deploy

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go/build
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.cache/npm
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

go_test:
  stage: verify
  image: docker.m.daocloud.io/library/golang:1.25
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go/
  script:
    - cd go-serve
    - go mod download
    - go test ./...

frontend_build:
  stage: build
  image: docker.m.daocloud.io/library/node:20
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm/
  script:
    - cd vue-demo
    - if [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi
    - npm run build
  artifacts:
    name: frontend-dist-$CI_COMMIT_SHORT_SHA
    paths:
      - vue-demo/dist/
    expire_in: 7 days

go_build:
  stage: build
  image: docker.m.daocloud.io/library/golang:1.25
  needs:
    - go_test
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go/
  script:
    - cd go-serve
    - go mod download
    - mkdir -p build
    - go build -o build/gin-demo ./main.go
  artifacts:
    name: backend-bin-$CI_COMMIT_SHORT_SHA
    paths:
      - go-serve/build/
    expire_in: 7 days

frontend_image:
  stage: package
  image: docker.m.daocloud.io/library/docker:27
  services:
    - name: docker.m.daocloud.io/library/docker:27-dind
      command:
        - --registry-mirror=https://docker.m.daocloud.io
  needs:
    - frontend_build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f vue-demo/Dockerfile -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" vue-demo
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:latest"
        docker push "$FRONTEND_IMAGE:latest"
      fi

backend_image:
  stage: package
  image: docker.m.daocloud.io/library/docker:27
  services:
    - name: docker.m.daocloud.io/library/docker:27-dind
      command:
        - --registry-mirror=https://docker.m.daocloud.io
  needs:
    - go_build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f go-serve/Dockerfile -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" go-serve
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$BACKEND_IMAGE:latest"
        docker push "$BACKEND_IMAGE:latest"
      fi

deploy_ubuntu:
  stage: deploy
  image: docker.m.daocloud.io/library/alpine:3.20
  needs:
    - backend_image
    - frontend_image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
      "cd '$DEPLOY_PATH' &&
      echo '$REGISTRY_PASSWORD' | docker login -u '$REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      export BACKEND_IMAGE='$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA' FRONTEND_IMAGE='$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA' &&
      docker compose -f docker-compose.prod.yml pull &&
      docker compose -f docker-compose.prod.yml up -d &&
      docker compose -f docker-compose.prod.yml ps"
  environment:
    name: production
  allow_failure: false
