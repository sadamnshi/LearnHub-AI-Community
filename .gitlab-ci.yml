workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - verify
  - build
  - package
  - deploy

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go/build
  GOPROXY: https://goproxy.cn,direct
  CGO_ENABLED: "0"
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.cache/npm
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

go_test:
  stage: verify
  image: docker.m.daocloud.io/library/golang:1.25
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go/
  script:
    - cd go-serve
    - go mod download
    - go test ./...

frontend_build:
  stage: build
  image: docker.m.daocloud.io/library/node:20
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm/
  script:
    - cd vue-demo
    - if [ -f package-lock.json ]; then npm ci --include=dev --prefer-offline --no-audit; else npm install --include=dev --prefer-offline --no-audit; fi
    - npm run build
  artifacts:
    name: frontend-dist-$CI_COMMIT_SHORT_SHA
    paths:
      - vue-demo/dist/
    expire_in: 7 days

go_build:
  stage: build
  image: docker.m.daocloud.io/library/golang:1.25
  needs:
    - go_test
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go/
  script:
    - cd go-serve
    - go mod download
    - mkdir -p build
    - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/gin-demo .
  artifacts:
    name: backend-bin-$CI_COMMIT_SHORT_SHA
    paths:
      - go-serve/build/
    expire_in: 7 days

.docker_package:
  stage: package
  image: docker.m.daocloud.io/library/docker:27
  services:
    - name: docker.m.daocloud.io/library/docker:27-dind
      alias: docker
      command: ["--registry-mirror=https://docker.m.daocloud.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - docker version
    - test -n "$CI_REGISTRY" || (echo "CI_REGISTRY is empty. Please enable Container Registry." && exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

frontend_image:
  extends: .docker_package
  needs:
    - job: frontend_build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - export DOCKER_BUILDKIT=1
    - test -d vue-demo/dist || (echo "vue-demo/dist artifact is missing" && exit 1)
    - docker build --pull -f vue-demo/Dockerfile.ci -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" vue-demo
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:latest"
        docker push "$FRONTEND_IMAGE:latest"
      fi

backend_image:
  extends: .docker_package
  needs:
    - job: go_build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - export DOCKER_BUILDKIT=1
    - test -f go-serve/build/gin-demo || (echo "go-serve/build/gin-demo artifact is missing" && exit 1)
    - docker build --pull -f go-serve/Dockerfile.ci -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" go-serve
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$BACKEND_IMAGE:latest"
        docker push "$BACKEND_IMAGE:latest"
      fi

deploy_ubuntu:
  stage: deploy
  image: docker.m.daocloud.io/library/alpine:3.20
  needs:
    - backend_image
    - frontend_image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
      "cd '$DEPLOY_PATH' &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      export BACKEND_IMAGE='$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA' FRONTEND_IMAGE='$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA' &&
      docker compose -f docker-compose.prod.yml pull &&
      docker compose -f docker-compose.prod.yml up -d &&
      docker compose -f docker-compose.prod.yml ps"
  environment:
    name: production
  allow_failure: false
